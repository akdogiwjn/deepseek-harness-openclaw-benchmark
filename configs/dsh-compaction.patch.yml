- insert:
    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.15
        retainTokens: 2000
        maxTokens: 512
        compactionRetries: 0
        maxOverflowRetries: 0
        auto: true
