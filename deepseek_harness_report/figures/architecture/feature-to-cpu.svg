<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness 机制到 Host CPU Workload 的证据矩阵</title>
  <desc id="desc">四项核心设计与两项补充机制或工作负载分别映射到 W 证据、Host 工作和 C 证据。</desc>
  <rect width="1100" height="650" fill="#FFFFFF"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif" fill="#17212B">
    <rect x="40" y="24" width="1010" height="56" rx="9" fill="#F3F6F9" stroke="#D7DEE7" stroke-width="1.4"/>
    <text x="180" y="59" text-anchor="middle" font-size="17" font-weight="750">机制 / Workload 来源</text><text x="390" y="59" text-anchor="middle" font-size="17" font-weight="750">W 证据</text><text x="650" y="59" text-anchor="middle" font-size="17" font-weight="750">Host 工作负载</text><text x="940" y="59" text-anchor="middle" font-size="17" font-weight="750">C 证据</text>
    <g stroke="#D7DEE7" stroke-width="1.2"><line x1="320" y1="24" x2="320" y2="540"/><line x1="460" y1="24" x2="460" y2="540"/><line x1="840" y1="24" x2="840" y2="540"/></g>
    <text x="40" y="112" font-size="16" font-weight="750" fill="#2563EB">DeepSeek Harness 核心设计</text><line x1="230" y1="107" x2="1050" y2="107" stroke="#D7DEE7"/>
    <g font-size="16">
      <rect x="40" y="128" width="1010" height="58" fill="#FFFFFF" stroke="#E8EDF3"/><rect x="40" y="186" width="1010" height="58" fill="#F8FAFC" stroke="#E8EDF3"/><rect x="40" y="244" width="1010" height="58" fill="#FFFFFF" stroke="#E8EDF3"/><rect x="40" y="302" width="1010" height="58" fill="#F8FAFC" stroke="#E8EDF3"/>
      <text x="70" y="164" font-weight="700">Capability Seam</text><text x="390" y="164" text-anchor="middle" fill="#2563EB" font-weight="750">W10</text><text x="490" y="164">Policy / filesystem path</text><text x="940" y="164" text-anchor="middle" fill="#0F766E" font-weight="750">C6</text>
      <text x="70" y="222" font-weight="700">Session Event Log</text><text x="390" y="222" text-anchor="middle" fill="#2563EB" font-weight="750">W9</text><text x="490" y="222">State append / persistence</text><text x="940" y="222" text-anchor="middle" fill="#0F766E" font-weight="750">C2</text>
      <text x="70" y="280" font-weight="700">Context Management</text><text x="390" y="280" text-anchor="middle" fill="#2563EB" font-weight="750">W5</text><text x="490" y="280">Context traversal / serialization</text><text x="940" y="280" text-anchor="middle" fill="#0F766E" font-weight="750">C3 / C8</text>
      <text x="70" y="338" font-weight="700">PTC / Code Mode</text><text x="390" y="338" text-anchor="middle" fill="#2563EB" font-weight="750">W8</text><text x="490" y="338">Execution granularity</text><text x="940" y="338" text-anchor="middle" fill="#0F766E" font-weight="750">C5</text>
    </g>
    <text x="40" y="408" font-size="16" font-weight="750" fill="#7C5CE7">补充机制 / Workload</text><line x1="220" y1="403" x2="1050" y2="403" stroke="#D7DEE7"/>
    <g font-size="16">
      <rect x="40" y="424" width="1010" height="58" fill="#FFFFFF" stroke="#E8EDF3"/><rect x="40" y="482" width="1010" height="58" fill="#F8FAFC" stroke="#E8EDF3"/>
      <text x="70" y="460" font-weight="700">Recovery Semantics</text><text x="390" y="460" text-anchor="middle" fill="#2563EB" font-weight="750">W4 / W6</text><text x="490" y="460">Agent control flow</text><text x="940" y="460" text-anchor="middle" fill="#667085">C1 参照</text>
      <text x="70" y="518" font-weight="700">Multi-Agent Scale</text><text x="390" y="518" text-anchor="middle" fill="#667085">—</text><text x="490" y="518">Runtime density / scheduling</text><text x="940" y="518" text-anchor="middle" fill="#0F766E" font-weight="750">C7</text>
    </g>
    <g stroke="#D7DEE7" stroke-width="1.2"><line x1="320" y1="128" x2="320" y2="360"/><line x1="460" y1="128" x2="460" y2="360"/><line x1="840" y1="128" x2="840" y2="360"/><line x1="320" y1="424" x2="320" y2="540"/><line x1="460" y1="424" x2="460" y2="540"/><line x1="840" y1="424" x2="840" y2="540"/></g>
    <rect x="40" y="574" width="1010" height="44" rx="8" fill="#FFFBEB" stroke="#E8D7A8"/>
    <text x="70" y="602" font-size="15" fill="#667085">说明：矩阵表达证据映射，不把 Multi-Agent Scale 或 Recovery Semantics 列为新的官方 Feature。</text>
  </g>
</svg>
