<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" role="img" aria-labelledby="title desc">
  <title id="title">Direct Tool Calling 与 PTC 的执行边界</title>
  <desc id="desc">两列严格对齐的执行流。Direct 在模型和工具间多次往返，PTC 由一个程序在工具管线内完成多次调用后返回模型。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="980" height="680" fill="#FFFFFF"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif" fill="#17212B">
    <text x="245" y="38" text-anchor="middle" font-size="21" font-weight="750">Direct</text>
    <text x="735" y="38" text-anchor="middle" font-size="21" font-weight="750">PTC / Code Mode</text>
    <line x1="490" y1="28" x2="490" y2="565" stroke="#E8EDF3" stroke-width="1.5"/>
    <g stroke-width="1.8">
      <rect x="110" y="72" width="270" height="58" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
      <rect x="110" y="165" width="270" height="58" rx="10" fill="#F8FAFC" stroke="#64748B"/>
      <rect x="110" y="258" width="270" height="58" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
      <rect x="110" y="351" width="270" height="58" rx="10" fill="#F8FAFC" stroke="#64748B"/>
      <rect x="110" y="500" width="270" height="58" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
    </g>
    <text x="245" y="109" text-anchor="middle" font-size="18" font-weight="700">Model Request 1</text>
    <text x="245" y="202" text-anchor="middle" font-size="18" font-weight="700">Tool 1</text>
    <text x="245" y="295" text-anchor="middle" font-size="18" font-weight="700">Model Request 2</text>
    <text x="245" y="388" text-anchor="middle" font-size="18" font-weight="700">Tool 2</text>
    <text x="245" y="459" text-anchor="middle" font-size="24" fill="#667085">⋮</text>
    <text x="245" y="537" text-anchor="middle" font-size="18" font-weight="700">Model Request N+1</text>
    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M245 134V159"/><path d="M245 227V252"/><path d="M245 320V345"/><path d="M245 413V435"/><path d="M245 470V494"/>
    </g>
    <g stroke-width="1.8">
      <rect x="600" y="72" width="270" height="58" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
      <rect x="600" y="165" width="270" height="58" rx="10" fill="#F5F3FF" stroke="#7C5CE7"/>
      <rect x="600" y="258" width="270" height="151" rx="10" fill="#F8FAFC" stroke="#7C5CE7"/>
      <rect x="600" y="500" width="270" height="58" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
    </g>
    <text x="735" y="109" text-anchor="middle" font-size="18" font-weight="700">Model Request 1</text>
    <text x="735" y="202" text-anchor="middle" font-size="19" font-weight="750">Program</text>
    <text x="735" y="298" text-anchor="middle" font-size="16" fill="#667085">Tool pipeline</text>
    <text x="735" y="332" text-anchor="middle" font-size="18" font-weight="700">Tool 1 · Tool 2 · … · Tool N</text>
    <text x="735" y="537" text-anchor="middle" font-size="18" font-weight="700">Model Request 2</text>
    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M735 134V159"/><path d="M735 227V252"/><path d="M735 413V494"/>
    </g>
    <rect x="105" y="580" width="280" height="38" rx="19" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
    <rect x="595" y="580" width="280" height="38" rx="19" fill="#F5F3FF" stroke="#7C5CE7" stroke-width="1.4"/>
    <text x="245" y="605" text-anchor="middle" font-size="15" font-weight="650" fill="#2563EB">多次 model-visible boundaries</text>
    <text x="735" y="605" text-anchor="middle" font-size="15" font-weight="650" fill="#7C5CE7">一次 program execution boundary</text>
    <text x="490" y="657" text-anchor="middle" font-size="16" fill="#667085">底层 Tool 工作不消失；减少的是外层 Model ↔ Tool orchestration boundary</text>
  </g>
</svg>
