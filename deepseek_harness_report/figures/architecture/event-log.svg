<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" role="img" aria-labelledby="title desc">
  <title id="title">Turn、Step 与 Session Event Log</title>
  <desc id="desc">一个 Turn 包含多个 Step，每个 Step 由有序 typed events 构成。Event Log 再支持上下文派生、恢复、分叉与重放。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs>
  <rect width="980" height="680" fill="#FFFFFF"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif" fill="#17212B">
    <rect x="40" y="28" width="900" height="330" rx="14" fill="#F8FAFC" stroke="#D7DEE7" stroke-width="1.8"/>
    <text x="70" y="62" font-size="20" font-weight="780">Turn</text>
    <rect x="75" y="78" width="830" height="122" rx="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="98" y="108" font-size="18" font-weight="750">Step 1</text>
    <g fill="#FFFFFF" stroke="#D7DEE7" stroke-width="1.3">
      <rect x="100" y="128" width="130" height="42" rx="8"/><rect x="260" y="128" width="150" height="42" rx="8"/>
      <rect x="440" y="128" width="120" height="42" rx="8"/><rect x="590" y="128" width="120" height="42" rx="8"/><rect x="740" y="128" width="130" height="42" rx="8"/>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" text-anchor="middle">
      <text x="165" y="154">user/message</text><text x="335" y="154">assistant/message</text><text x="500" y="154">tool/call</text><text x="650" y="154">tool/result</text><text x="805" y="154">step/end</text>
    </g>
    <g fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow)"><path d="M234 149H254"/><path d="M414 149H434"/><path d="M564 149H584"/><path d="M714 149H734"/></g>
    <rect x="75" y="218" width="830" height="92" rx="11" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.6"/>
    <text x="98" y="249" font-size="18" font-weight="750">Step 2</text>
    <text x="490" y="281" text-anchor="middle" font-size="16" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">assistant/message → tool/call → tool/result → step/end</text>
    <text x="870" y="340" text-anchor="end" font-size="15" fill="#667085" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">turn/end</text>
    <path d="M490 363V397" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="325" y="405" width="330" height="68" rx="12" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.8"/>
    <text x="490" y="447" text-anchor="middle" font-size="21" font-weight="780">Session Event Log</text>
    <g fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow)"><path d="M430 478L230 530"/><path d="M490 478V530"/><path d="M550 478L750 530"/></g>
    <g fill="#FFFFFF" stroke="#D7DEE7" stroke-width="1.2"><rect x="95" y="538" width="270" height="82" rx="10"/><rect x="355" y="538" width="270" height="82" rx="10"/><rect x="615" y="538" width="270" height="82" rx="10"/></g>
    <circle cx="122" cy="565" r="6" fill="#2563EB"/><circle cx="382" cy="565" r="6" fill="#0F766E"/><circle cx="642" cy="565" r="6" fill="#7C5CE7"/>
    <text x="230" y="570" text-anchor="middle" font-size="17" font-weight="750" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">deriveMessages()</text>
    <text x="490" y="570" text-anchor="middle" font-size="17" font-weight="750">Resume</text><text x="750" y="570" text-anchor="middle" font-size="17" font-weight="750">Fork / Replay</text>
    <text x="230" y="598" text-anchor="middle" font-size="15" fill="#667085">Model Context</text><text x="490" y="598" text-anchor="middle" font-size="15" fill="#667085">repair / continue</text><text x="750" y="598" text-anchor="middle" font-size="15" fill="#667085">shared prefix / recorded stream</text>
    <text x="490" y="654" text-anchor="middle" font-size="15" fill="#667085">同一 durable stream 提供顺序、边界与可追踪性</text>
  </g>
</svg>
